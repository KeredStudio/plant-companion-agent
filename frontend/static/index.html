<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plant Companion ❄️ aespa Winter Cyber-Frost Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --winter-ice: #00f2fe;
    --winter-cyan: #4facfe;
    --winter-frost: #e0f7fa;
    --winter-purple: #9b51e0;
    --winter-deep-purple: #170d2b;
    --winter-bg: #090614;
    --winter-card-bg: rgba(22, 16, 42, 0.75);
    --winter-card-border: rgba(79, 172, 254, 0.35);
    --winter-glow: rgba(0, 242, 254, 0.45);
    --winter-sparkle: #ff76ac;
    --winter-text: #f0f6fc;
    --winter-text-sub: #a5b4fc;
    --border: rgba(147, 197, 253, 0.22);
    --sidebar-w: 340px;
    --header-height: 58px;
  }
  * { box-sizing: border-box; }
  html {
    width: 100%;
    height: 100%;
    background: var(--winter-bg);
  }
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
    font-family: 'Outfit', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 15% 15%, #180d33 0%, #0a0618 55%, #05030b 100%);
    color: var(--winter-text);
    display: flex;
    flex-direction: column;
  }

  /* Falling Snowflakes Canvas */
  #snowCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Header - aespa Winter Futuristic Ice-Glass */
  header {
    background: linear-gradient(135deg, rgba(20, 12, 38, 0.9) 0%, rgba(13, 24, 48, 0.95) 50%, rgba(26, 12, 45, 0.9) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    padding: 0.75rem 1rem;
    padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15), 0 1px 0 rgba(0, 242, 254, 0.35);
    z-index: 50;
    border-bottom: 1.5px solid rgba(0, 242, 254, 0.3);
    flex-shrink: 0;
    width: 100%;
    position: relative;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: .65rem;
    min-width: 0;
  }
  .hamburger-btn, .header-icon-btn {
    background: rgba(0, 242, 254, 0.08);
    border: 1px solid rgba(0, 242, 254, 0.35);
    color: var(--winter-ice);
    cursor: pointer;
    padding: 6px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s ease;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
  }
  .hamburger-btn:active, .hamburger-btn:hover, .header-icon-btn:hover {
    background: rgba(0, 242, 254, 0.2);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    transform: scale(1.05);
  }
  .hamburger-btn span, .header-icon-btn span { font-size: 1.4rem; color: var(--winter-ice); display: block; }
  .header-title {
    font-size: 1.1rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: .4rem;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(135deg, #ffffff 10%, #80d0ff 50%, #e0aaff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
  }

  /* Audio Lo-Fi BGM Player in Header */
  .header-right {
    display: flex;
    align-items: center;
    gap: .55rem;
  }
  .bgm-btn {
    background: rgba(155, 81, 224, 0.2);
    border: 1px solid rgba(0, 242, 254, 0.5);
    color: #fff;
    padding: 5px 9px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: .35rem;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    transition: all 0.25s;
    user-select: none;
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
  }
  .bgm-btn.playing {
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.35) 0%, rgba(155, 81, 224, 0.45) 100%);
    border-color: var(--winter-ice);
    box-shadow: 0 0 16px rgba(0, 242, 254, 0.5);
  }
  .bgm-wave {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 12px;
  }
  .bgm-wave span {
    width: 2.5px;
    height: 100%;
    background: var(--winter-ice);
    border-radius: 1px;
    animation: waveAnim 1s infinite ease-in-out alternate;
  }
  .bgm-wave span:nth-child(2) { animation-delay: 0.2s; height: 60%; }
  .bgm-wave span:nth-child(3) { animation-delay: 0.4s; height: 80%; }
  @keyframes waveAnim {
    0% { height: 30%; }
    100% { height: 100%; }
  }

  /* Drawer / Overlay */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 3, 12, 0.75);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 60;
    backdrop-filter: blur(5px);
  }
  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    max-width: 88vw;
    background: rgba(14, 10, 28, 0.95);
    backdrop-filter: blur(16px);
    box-shadow: 6px 0 30px rgba(0, 242, 254, 0.2);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    z-index: 70;
    border-right: 1.5px solid rgba(0, 242, 254, 0.35);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar-header {
    background: linear-gradient(135deg, rgba(23, 13, 43, 0.95) 0%, rgba(10, 20, 42, 0.95) 100%);
    color: #fff;
    padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1rem 0.9rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0, 242, 254, 0.25);
  }
  .sidebar-header h2 {
    margin: 0;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    color: var(--winter-ice);
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    display: flex;
  }
  .close-btn:hover { background: rgba(0, 242, 254, 0.15); color: var(--winter-ice); }

  /* Sidebar Tabs */
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid rgba(0, 242, 254, 0.2);
    background: rgba(10, 6, 22, 0.85);
  }
  .tab-btn {
    flex: 1;
    padding: .7rem;
    background: transparent;
    border: none;
    color: var(--winter-text-sub);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .3rem;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--winter-ice);
    border-bottom-color: var(--winter-ice);
    background: rgba(0, 242, 254, 0.08);
  }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: .75rem;
    background: transparent;
    -webkit-overflow-scrolling: touch;
  }
  .history-empty, .garden-empty {
    color: var(--winter-text-sub);
    font-size: .88rem;
    text-align: center;
    margin-top: 1.5rem;
    line-height: 1.6;
  }
  .history-item {
    border: 1px solid rgba(0, 242, 254, 0.2);
    border-radius: 12px;
    padding: .85rem;
    background: rgba(22, 16, 42, 0.6);
    transition: all 0.25s ease;
    border-left: 3px solid var(--winter-cyan);
    cursor: pointer;
  }
  .history-item:hover {
    border-color: var(--winter-ice);
    background: rgba(30, 20, 60, 0.8);
    border-left: 3px solid var(--winter-ice);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
  }
  .history-time {
    font-size: .72rem;
    color: var(--winter-text-sub);
    margin-bottom: .3rem;
    display: flex;
    align-items: center;
    gap: .25rem;
  }
  .history-user {
    font-weight: 600;
    color: #fff;
    font-size: .88rem;
    margin-bottom: .25rem;
    word-break: break-word;
  }
  .history-agent-preview {
    font-size: .8rem;
    color: #b0c0e0;
    line-height: 1.35;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  /* My Garden Cards */
  .garden-card {
    background: linear-gradient(135deg, rgba(23, 16, 45, 0.8) 0%, rgba(13, 26, 52, 0.8) 100%);
    border: 1px solid rgba(0, 242, 254, 0.3);
    border-radius: 12px;
    padding: .85rem;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  .garden-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .garden-name {
    font-weight: 700;
    color: #fff;
    font-size: .95rem;
  }
  .garden-badge {
    font-size: .7rem;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(0, 242, 254, 0.15);
    border: 1px solid rgba(0, 242, 254, 0.4);
    color: var(--winter-ice);
  }
  .garden-meta {
    font-size: .78rem;
    color: #b0c0e0;
    display: flex;
    justify-content: space-between;
  }
  .water-btn {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: .35rem .7rem;
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: .25rem;
    margin-top: .3rem;
  }

  /* Badges Section in Drawer */
  .badge-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .65rem;
    margin-top: .5rem;
  }
  .badge-item {
    background: rgba(22, 16, 42, 0.7);
    border: 1px solid rgba(0, 242, 254, 0.25);
    border-radius: 10px;
    padding: .65rem;
    text-align: center;
  }
  .badge-icon {
    font-size: 1.6rem;
    margin-bottom: .25rem;
  }
  .badge-title {
    font-size: .78rem;
    font-weight: 700;
    color: #fff;
  }
  .badge-desc {
    font-size: .68rem;
    color: var(--winter-text-sub);
  }

  .sidebar-footer {
    padding: calc(0.7rem + env(safe-area-inset-bottom, 0px)) 1rem 0.7rem 1rem;
    border-top: 1px solid rgba(0, 242, 254, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10, 6, 20, 0.9);
  }
  .clear-btn {
    background: rgba(255, 118, 172, 0.15);
    color: #ff85b3;
    border: 1px solid rgba(255, 118, 172, 0.4);
    border-radius: 8px;
    padding: .4rem .75rem;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* Chat Log & Message Rows */
  #log {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 1.1rem 1rem .6rem 1rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 5;
  }
  
  .chat-row {
    margin: 1.1rem 0;
    display: flex;
    gap: .75rem;
    align-items: flex-start;
    width: 100%;
  }
  .chat-row.user {
    flex-direction: row-reverse;
  }
  .chat-row.agent {
    flex-direction: row;
  }

  /* Avatars */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    user-select: none;
  }
  .avatar.agent {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    box-shadow: 0 0 18px rgba(0, 242, 254, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
    border: 1.5px solid var(--winter-ice);
  }
  .avatar.user {
    background: linear-gradient(135deg, #4b1248 0%, #f0c27b 100%);
    box-shadow: 0 0 18px rgba(255, 118, 172, 0.5);
    border: 1.5px solid #ff9ebb;
  }

  .msg-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    max-width: calc(100% - 50px);
  }
  .chat-row.user .msg-col {
    align-items: flex-end;
  }
  .chat-row.agent .msg-col {
    align-items: flex-start;
  }

  .sender-meta {
    font-size: .75rem;
    color: var(--winter-text-sub);
    margin-bottom: .3rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    padding: 0 .3rem;
    letter-spacing: 0.3px;
  }
  .sender-name {
    font-weight: 700;
  }
  .chat-row.agent .sender-name {
    color: var(--winter-ice);
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
  }
  .chat-row.user .sender-name {
    color: #ff9ebb;
    text-shadow: 0 0 10px rgba(255, 118, 172, 0.4);
  }

  .bubble {
    display: inline-block;
    padding: .85rem 1.15rem;
    border-radius: 16px;
    background: rgba(22, 16, 42, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 242, 254, 0.25);
    text-align: left;
    max-width: 100%;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    line-height: 1.55;
    font-size: .96rem;
    color: var(--winter-text);
  }
  .chat-row.user .bubble {
    background: linear-gradient(135deg, rgba(155, 81, 224, 0.85) 0%, rgba(214, 51, 132, 0.85) 100%);
    color: #fff;
    border: 1px solid rgba(255, 150, 200, 0.4);
    border-top-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(214, 51, 132, 0.35);
  }
  .chat-row.agent .bubble {
    border-top-left-radius: 4px;
    border-left: 3px solid var(--winter-ice);
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  .msg-time {
    font-size: .68rem;
    color: #7b88a8;
    margin-top: .3rem;
    padding: 0 .4rem;
  }

  /* Welcome Card */
  .welcome-card {
    background: linear-gradient(145deg, rgba(23, 14, 45, 0.9) 0%, rgba(13, 26, 52, 0.9) 100%);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(0, 242, 254, 0.4);
    border-top: 3px solid var(--winter-ice);
    border-radius: 16px;
    padding: 1.25rem 1.35rem;
    box-shadow: 0 8px 32px rgba(0, 242, 254, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    line-height: 1.6;
    color: #f0f6fc;
    width: 100%;
    max-width: 100%;
    word-break: break-word;
    position: relative;
    overflow: hidden;
  }
  .welcome-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: .6rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    flex-wrap: wrap;
    background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #e0aaff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
  }
  .welcome-desc {
    font-size: .92rem;
    margin-bottom: .85rem;
    color: #d1dcfa;
    line-height: 1.6;
  }
  .welcome-feature-list {
    margin: 0 0 .95rem 0;
    padding-left: 1.25rem;
    font-size: .88rem;
    color: #c0d0f5;
  }
  .welcome-feature-list li {
    margin-bottom: .4rem;
  }
  .welcome-feature-list strong {
    color: var(--winter-ice);
  }
  .suggestion-chips {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    margin-top: .85rem;
    border-top: 1px dashed rgba(0, 242, 254, 0.3);
    padding-top: .85rem;
  }
  .chip {
    background: rgba(0, 242, 254, 0.08);
    border: 1px solid rgba(0, 242, 254, 0.35);
    color: var(--winter-frost);
    padding: .4rem .8rem;
    border-radius: 20px;
    font-size: .82rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.25s ease;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    white-space: normal;
    text-align: left;
    line-height: 1.3;
    backdrop-filter: blur(8px);
  }
  .chip:active, .chip:hover {
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.3) 0%, rgba(155, 81, 224, 0.4) 100%);
    color: #ffffff;
    border-color: var(--winter-ice);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    transform: translateY(-1px);
  }

  /* Form & Input - Docked securely to bottom with Mic Voice Input */
  form {
    display: flex;
    gap: .6rem;
    padding: .85rem 1rem;
    padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(0, 242, 254, 0.25);
    background: rgba(14, 10, 28, 0.92);
    backdrop-filter: blur(15px);
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
    border-radius: 14px 14px 0 0;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  input {
    flex: 1;
    padding: .8rem 1.05rem;
    border: 1.5px solid rgba(0, 242, 254, 0.3);
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    background: rgba(22, 16, 42, 0.85);
    color: #fff;
    transition: all 0.25s ease;
    min-width: 0;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
  }
  input::placeholder {
    color: #7d8ba8;
  }
  input:focus {
    border-color: var(--winter-ice);
    background: rgba(30, 22, 58, 0.95);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
  }
  .mic-btn {
    background: rgba(0, 242, 254, 0.1);
    border: 1.5px solid rgba(0, 242, 254, 0.4);
    color: var(--winter-ice);
    border-radius: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .mic-btn.listening {
    background: #ff4757;
    border-color: #ff6b81;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 71, 87, 0.7);
    animation: pulseMic 1.2s infinite alternate;
  }
  @keyframes pulseMic {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }
  button.send-btn {
    padding: .8rem 1.35rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9b51e0 100%);
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: .35rem;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    flex-shrink: 0;
    font-size: .95rem;
    letter-spacing: 0.5px;
  }
  button.send-btn:active {
    transform: scale(0.97);
  }

  /* A2UI components */
  .a2card {
    border: 1px solid rgba(0, 242, 254, 0.35);
    border-radius: 14px;
    padding: 1.05rem;
    background: rgba(20, 14, 40, 0.85);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 25px rgba(0, 242, 254, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    width: 100%;
    max-width: 100%;
    border-top: 3px solid var(--winter-ice);
    word-break: break-word;
    overflow-wrap: anywhere;
    color: #f0f6fc;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: .65rem; }
  .a2col { display: flex; flex-direction: column; gap: .5rem; width: 100%; max-width: 100%; }
  .a2row { display: flex; flex-direction: row; gap: .55rem; align-items: center; flex-wrap: wrap; width: 100%; max-width: 100%; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; word-break: break-word; color: #e2e8f0; }
  .a2text.a2-h1 { font-size: 1.35rem; font-weight: 800; color: #ffffff; text-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
  .a2text.a2-h2 { font-size: 1.18rem; font-weight: 700; color: var(--winter-ice); border-bottom: 1px solid rgba(0, 242, 254, 0.25); padding-bottom: .3rem; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 700; color: #ff9ebb; }
  .a2text.a2-h4 { font-size: .98rem; font-weight: 600; color: var(--winter-frost); }

  .a2divider { border: none; border-top: 1px dashed rgba(0, 242, 254, 0.25); margin: .45rem 0; width: 100%; }
  .a2img { max-width: 100%; height: auto; border-radius: 10px; display: block; box-shadow: 0 0 25px rgba(0, 242, 254, 0.3); border: 1.5px solid rgba(0, 242, 254, 0.5); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--winter-ice); }

  /* Responsive Mobile Overrides */
  @media (max-width: 600px) {
    header { padding-left: .85rem; padding-right: .85rem; padding-top: calc(0.6rem + env(safe-area-inset-top, 0px)); padding-bottom: 0.6rem; }
    .header-title { font-size: 1rem; }
    .bgm-btn { font-size: .7rem; padding: 4px 7px; }
    #log { padding: .75rem .75rem .4rem .75rem; }
    .chat-row { gap: .5rem; margin: .85rem 0; }
    .avatar { width: 36px; height: 36px; font-size: 1.1rem; }
    .msg-col { max-width: calc(100% - 44px); }
    .bubble { padding: .7rem .95rem; font-size: .92rem; border-radius: 14px; }
    .welcome-card { padding: 1rem .9rem; }
    .welcome-title { font-size: 1.02rem; }
    .welcome-desc { font-size: .86rem; }
    .welcome-feature-list { font-size: .84rem; padding-left: 1.15rem; }
    .chip { font-size: .78rem; padding: .32rem .65rem; }
    form { padding: .65rem .75rem calc(0.65rem + env(safe-area-inset-bottom, 0px)) .75rem; gap: .45rem; border-radius: 0; }
    input { padding: .7rem .85rem; }
    button.send-btn { padding: .7rem 1rem; font-size: .9rem; }
    .a2card { padding: .85rem; }
  }
</style>
</head>
<body>

<!-- Interactive Snowfall Canvas -->
<canvas id="snowCanvas"></canvas>

<!-- Audio Element for Lyria Lo-Fi -->

<header>
  <div class="header-left">
    <button id="menuBtn" class="hamburger-btn" aria-label="選單" title="花園與記憶">

    </button>
    <div class="header-title">

    </div>

<script>
// 1. Particle Canvas (Snow & Cyber Dust)
const canvas = document.getElementById("snowCanvas");
const ctx = canvas.getContext("2d");
let width, height;
function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const particles = [];
const particleCount = 45;
for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * width,
    y: Math.random() * height,
    radius: Math.random() * 2.2 + 0.8,
    speedY: Math.random() * 0.9 + 0.3,
    speedX: Math.sin(i) * 0.4,
    opacity: Math.random() * 0.65 + 0.25,
    glow: Math.random() > 0.5
  });
}

function renderSnow() {
  ctx.clearRect(0, 0, width, height);
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    if (p.glow) {
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#00f2fe";
      ctx.fillStyle = `rgba(0, 242, 254, ${p.opacity})`;
    } else {
      ctx.shadowBlur = 4;
      ctx.shadowColor = "#e0aaff";
      ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
    }
    ctx.fill();
    p.y += p.speedY;
    p.x += p.speedX;
    if (p.y > height) { p.y = -5; p.x = Math.random() * width; }
    if (p.x > width) p.x = 0;
    if (p.x < 0) p.x = width;
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(renderSnow);
}
requestAnimationFrame(renderSnow);

// 2. Audio BGM Player
const bgmAudio = document.getElementById("bgmAudio");
const bgmBtn = document.getElementById("bgmBtn");
const bgmWave = document.getElementById("bgmWave");
const bgmIcon = document.getElementById("bgmIcon");
let isPlaying = false;

bgmBtn.addEventListener("click", () => {
  if (!isPlaying) {
    bgmAudio.play().then(() => {
      isPlaying = true;
      bgmBtn.classList.add("playing");
      bgmWave.style.display = "inline-flex";
      bgmIcon.textContent = "pause";
    }).catch(e => console.log("Audio play blocked:", e));
  } else {
    bgmAudio.pause();
    isPlaying = false;
    bgmBtn.classList.remove("playing");
    bgmWave.style.display = "none";
    bgmIcon.textContent = "music_note";
  }
});

// 3. Web Speech API (Voice Input)
const micBtn = document.getElementById("micBtn");
const input = document.getElementById("input");
let recognition = null;
let isListening = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-TW';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add("listening");
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if (transcript) {
      input.value = transcript;
      sendMessage(transcript);
    }
  };

  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove("listening");
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove("listening");
  };

  micBtn.addEventListener("click", () => {
    if (!isListening) {
      try { recognition.start(); } catch (e) {}
    } else {
      recognition.stop();
    }
  });
} else {
  micBtn.style.display = "none";
}

// 4. Chat & Drawer
const log = document.getElementById("log");
const form = document.getElementById("form");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const historyList = document.getElementById("historyList");
const gardenList = document.getElementById("gardenList");
const clearHistoryBtn = document.getElementById("clearHistoryBtn");

// Tabs
const tabGarden = document.getElementById("tabGarden");
const tabHistory = document.getElementById("tabHistory");
const tabBadges = document.getElementById("tabBadges");
const sidebarGarden = document.getElementById("sidebarGarden");
const sidebarHistory = document.getElementById("sidebarHistory");
const sidebarBadges = document.getElementById("sidebarBadges");

function switchTab(tab) {
  [tabGarden, tabHistory, tabBadges].forEach(t => t.classList.remove("active"));
  [sidebarGarden, sidebarHistory, sidebarBadges].forEach(s => s.style.display = "none");
  if (tab === "garden") { tabGarden.classList.add("active"); sidebarGarden.style.display = "flex"; renderGarden(); }
  if (tab === "history") { tabHistory.classList.add("active"); sidebarHistory.style.display = "flex"; renderHistorySidebar(); }
  if (tab === "badges") { tabBadges.classList.add("active"); sidebarBadges.style.display = "flex"; }
}
tabGarden.addEventListener("click", () => switchTab("garden"));
tabHistory.addEventListener("click", () => switchTab("history"));
tabBadges.addEventListener("click", () => switchTab("badges"));

// LocalStorage History Key
const HISTORY_KEY = "plant_companion_history_v1";
const GARDEN_KEY = "plant_companion_garden_v1";

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
}
function saveHistory(history) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-30))); } catch {}
}

// Default virtual garden items
const DEFAULT_GARDEN = [
  { name: "龜背竹 (Monstera Deliciosa)", interval: 7, lastWatered: "2026-11-18", nextDue: "2026-11-25", daysLeft: 5 },
  { name: "琴葉榕 (Fiddle Leaf Fig)", interval: 10, lastWatered: "2026-11-15", nextDue: "2026-11-25", daysLeft: 5 },
  { name: "虎尾蘭 (Snake Plant)", interval: 14, lastWatered: "2026-11-10", nextDue: "2026-11-24", daysLeft: 4 }
];

function loadGarden() {
  try {
    const g = JSON.parse(localStorage.getItem(GARDEN_KEY));
    return g && g.length ? g : DEFAULT_GARDEN;
  } catch { return DEFAULT_GARDEN; }
}
function saveGarden(g) {
  try { localStorage.setItem(GARDEN_KEY, JSON.stringify(g)); } catch {}
}

function renderGarden() {
  const garden = loadGarden();
  gardenList.innerHTML = "";
  if (!garden.length) {
    gardenList.innerHTML = '<div class="garden-empty">尚無植物登記。在對話中告知澆水即可自動加入花園！</div>';
    return;
  }
  garden.forEach((p, idx) => {
    const card = el("div", "garden-card");
    card.innerHTML = `
      <div class="garden-card-head">
        <span class="garden-name">${p.name}</span>
        <span class="garden-badge">每 ${p.interval} 天</span>
      </div>
      <div class="garden-meta">
        <span>上次澆水: ${p.lastWatered}</span>
        <span style="color:var(--winter-ice); font-weight:600;">下次: ${p.nextDue}</span>
      </div>
      <button class="water-btn" onclick="quickWater(${idx})">
        <span class="material-symbols-outlined" style="font-size:.9rem;">water_drop</span> 今日已澆水
      </button>
    `;
    gardenList.appendChild(card);
  });
}

window.quickWater = function(idx) {
  const garden = loadGarden();
  const plant = garden[idx];
  const now = new Date();
  const next = new Date(now.getTime() + (plant.interval || 7) * 86400000);
  plant.lastWatered = now.toISOString().slice(0, 10);
  plant.nextDue = next.toISOString().slice(0, 10);
  saveGarden(garden);
  renderGarden();
  sendMessage(`我剛剛幫 ${plant.name.split(' ')[0]} 澆水了，請幫我登記打卡。`);
};

function renderHistorySidebar() {
  const history = loadHistory();
  historyList.innerHTML = "";
  if (!history.length) {
    historyList.innerHTML = '<div class="history-empty">尚無對話記錄。<br>與 Winter 綠植夥伴交談後即可在此調閱回顧！</div>';
    return;
  }
  for (let i = history.length - 1; i >= 0; i--) {
    const item = history[i];
    const div = el("div", "history-item");
    const time = el("div", "history-time");
    time.innerHTML = `<span class="material-symbols-outlined" style="font-size:.85rem;color:var(--winter-ice);">schedule</span> ${item.time || ""}`;
    div.appendChild(time);
    div.appendChild(el("div", "history-user", item.userText));
    div.appendChild(el("div", "history-agent-preview", item.agentPreview || "(回傳卡片或圖形元件)"));
    div.addEventListener("click", () => {
      closeSidebar();
      input.value = item.userText;
      input.focus();
    });
    historyList.appendChild(div);
  }
}

function openSidebar() {
  switchTab("garden");
  sidebar.classList.add("open");
  overlay.classList.add("open");
}
function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
}

menuBtn.addEventListener("click", openSidebar);
closeBtn.addEventListener("click", closeSidebar);
overlay.addEventListener("click", closeSidebar);

clearHistoryBtn.addEventListener("click", () => {
  if (confirm("確定要重設所有記憶庫記錄嗎？")) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistorySidebar();
  }
});

function getNowTimeStr() {
  const now = new Date();
  return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "chat-row " + who);
  const avatar = el("div", "avatar " + who);
  avatar.innerHTML = who === "agent" ? "❄️" : "✨";
  avatar.title = who === "agent" ? "Winter (Plant Guardian)" : "You (MY / Greenery Master)";
  
  const col = el("div", "msg-col");
  const meta = el("div", "sender-meta");
  const name = el("span", "sender-name", who === "agent" ? "Winter ❄️ (Plant Guardian)" : "MY 🌿 (綠植守護者)");
  meta.appendChild(name);
  col.appendChild(meta);
  
  const b = el("div", "bubble");
  col.appendChild(b);
  
  const timeEl = el("div", "msg-time", getNowTimeStr());
  col.appendChild(timeEl);
  
  row.appendChild(avatar);
  row.appendChild(col);
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return { bubble: b, timeEl: timeEl };
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join(" ").trim();
}

function renderReply(b, timeEl, parts) {
  b.textContent = "";
  if (timeEl) timeEl.textContent = getNowTimeStr();
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;

  let preview = textStr;
  if (!preview && a2ui.length) {
    preview = flattenText(a2ui) || "❄️ [A2UI 晶瑩資訊卡片]";
  }
  return preview || "(無文字回覆)";
}

async function sendMessage(text) {
  if (!text) return;
  const userMsg = bubble("user");
  userMsg.bubble.textContent = text;
  input.value = "";
  const agentMsg = bubble("agent");
  agentMsg.bubble.textContent = "…";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    const preview = renderReply(agentMsg.bubble, agentMsg.timeEl, data.parts || []);

    const history = loadHistory();
    history.push({
      time: getNowTimeStr(),
      userText: text,
      agentPreview: preview
    });
    saveHistory(history);

  } catch (e) {
    agentMsg.bubble.textContent = "Error: " + e.message;
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  sendMessage(text);
});

// Render Welcome Card on Initial Load
function showWelcomeMessage() {
  const agentMsg = bubble("agent");
  agentMsg.bubble.classList.add("rich");
  
  const card = el("div", "welcome-card");
  const title = el("div", "welcome-title");
  title.innerHTML = `<span>❄️</span> <span>Welcome to KWANGYA · Winter's Cyber Botanical Sanctuary</span> <span>🦋</span>`;
  card.appendChild(title);

  const desc = el("div", "welcome-desc");
  desc.innerHTML = `Hello, MY! 我是你的專屬植物守護者 <strong>Winter ❄️</strong>。在冰封寒冬與賽博綠意交織的曠野中，我隨時陪伴你呵護室內植栽、解鎖防寒奧秘與召喚藝術圖鑑。`;
  card.appendChild(desc);

  const list = el("ul", "welcome-feature-list");
  list.innerHTML = `
    <li>🎧 <strong>冬日 Lo-Fi 旋律</strong>：點擊右上角 BGM 播放器，聆聽專屬放鬆音樂</li>
    <li>🎙️ <strong>語音打卡問答</strong>：手忙腳亂時點選麥克風，語音詢問或記錄澆水</li>
    <li>🌱 <strong>我的花園儀表板</strong>：展開左上選單查看登記植物的澆水倒數</li>
    <li>🎨 <strong>Gemini 藝術圖鑑</strong>：喚醒 Gemini 繪製典雅的植物圖鑑插畫</li>
  `;
  card.appendChild(list);

  const chipsContainer = el("div", "suggestion-chips");
  const suggestions = [
    { label: "❄️ 龜背竹極寒越冬秘訣", query: "龜背竹在冬天的照護指南是什麼？" },
    { label: "🌨️ 查詢舊金山即時防寒天候", query: "What is the weather in San Francisco and plant advice?" },
    { label: "🎨 召喚虎尾蘭古典水彩插畫", query: "Please generate a botanical illustration of a Snake Plant" },
    { label: "💧 登記琴葉榕補水打卡", query: "I just watered my Fiddle Leaf Fig today" },
    { label: "🌸 搜尋台北特色花店據點", query: "Find florists near Taipei, Taiwan" }
  ];

  suggestions.forEach(s => {
    const chip = el("div", "chip");
    chip.innerHTML = s.label;
    chip.addEventListener("click", () => {
      sendMessage(s.query);
    });
    chipsContainer.appendChild(chip);
  });

  card.appendChild(chipsContainer);
  agentMsg.bubble.appendChild(card);
}

// Initialize
showWelcomeMessage();
</script>
